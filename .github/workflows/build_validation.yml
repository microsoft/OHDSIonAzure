---
name: Build Validation

on: # yamllint disable-line rule:truthy
  pull_request:
    branches:
      - main
      - "feature/**"
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Filter changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            main:
              - 'infra/**'
            main_json:
              - 'infra/arm_output/main.json'

      - name: "Stale ARM Template"
        if: ${{ steps.filter.outputs.main == 'true' &&
          steps.filter.outputs.main_json == 'false' }}
        run: echo "::error::Stale ARM Template, please regenerate." && exit 1

      # MegaLinter
      - name: Lint code base
        id: megalinter
        uses: oxsecurity/megalinter@9949bad031045f366be2467e00e8371a7328a2e2 # v10.1.0
        env:
          # All available variables are described in documentation
          # https://megalinter.io/configuration/
          VALIDATE_ALL_CODEBASE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }} # Validates all source when push on main, else just the git diff with main. Override with true if you always want to lint all sources
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
